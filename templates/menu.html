<!DOCTYPE html>
<html>
<head>
    <title>Menu</title>
</head>
<body style="font-family:Arial; background:#eef2ff; padding:30px;">

<div style="max-width:600px; margin:40px auto; background:white; padding:20px; border:1px solid #ddd;">
    <h1 style="color:#4338ca;">🍽️ Menu</h1>

    <table border="1" style="width:100%; border-collapse:collapse;">
        <tr style="background:#4338ca; color:white;">
            <th>Item</th>
            <th>Price</th>
        </tr>

        {% for item in items %}
        <tr>
            <td>{{ item[0] }}</td>
            <td>₹{{ item[1] }}</td>
        </tr>
        {% endfor %}
    </table>

    <h2 style="color:#4338ca;">Add Item</h2>

    <form method="POST" action="/add-item">
        <input name="name" placeholder="Item name" required>
        <input name="price" type="number" placeholder="Price" required>
        <button style="background:#4338ca; color:white; border:0; padding:8px 14px;">
            Add Item
        </button>
    </form>
</div>

</body>
</html>
