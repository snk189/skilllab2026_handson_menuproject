<!DOCTYPE html>
<html>
<head>
    <title>Admin Login</title>
</head>
<body style="font-family:Arial; background:#eef2ff; padding:30px;">

<div style="max-width:400px; margin:40px auto; background:white; padding:20px; border:1px solid #ddd;">
    <h1 style="color:#4338ca;">Admin Login</h1>

    <form method="POST" action="/login">
        <input name="username" placeholder="Username" required><br><br>
        <input name="password" type="password" placeholder="Password" required><br><br>
        <button style="background:#4338ca; color:white; border:0; padding:8px 14px;">
            Login
        </button>
    </form>
</div>

</body>
</html>
